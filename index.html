<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spritdispenser – 3. semester</title>
<style>
:root{
  --bg:#f4f2ee;--card:#fff;--ink:#1d1c1a;--muted:#6f6b64;--line:#dcd8d0;--accent:#2f5bea;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#18181a;--card:#2c2c30;--ink:#ecebe8;--muted:#9b9893;--line:#38383c;--accent:#7a9bff;}
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;
  -webkit-font-smoothing:antialiased;
}
main{width:100%;max-width:640px}
h1{font-size:2rem;font-weight:700;letter-spacing:-.02em}
p.sub{color:var(--muted);margin:.4rem 0 2rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1rem}
a.card{
  display:block;text-decoration:none;color:inherit;background:var(--card);
  border:1px solid var(--line);border-radius:12px;padding:1.5rem;
  transition:transform .15s ease,border-color .15s ease,box-shadow .15s ease;
}
a.card:hover,a.card:focus-visible{
  transform:translateY(-2px);border-color:var(--accent);
  box-shadow:0 6px 20px rgba(0,0,0,.08);outline:none;
}
.card h2{font-size:1.15rem;margin-bottom:.35rem;display:flex;justify-content:space-between}
.card h2 span{color:var(--accent)}
.card p{color:var(--muted);font-size:.9rem;line-height:1.4}
</style>
</head>
<body>
<main>
  <h1>Spritdispenser</h1>
  <p class="sub">3. semester projekt – KEA</p>
  <div class="grid">
    <a class="card" href="Kanban.html">
      <h2>Kanban <span>→</span></h2>
      <p>Opgaver og status på projektet.</p>
    </a>
    <a class="card" href="Gantt.html">
      <h2>Gantt <span>→</span></h2>
      <p>Tidsplan og milepæle.</p>
    </a>
  </div>
</main>
</body>
</html>
