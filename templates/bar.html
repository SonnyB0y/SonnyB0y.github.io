<!doctype html>
<html>
<head>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <style>
    body {
      background-color: #272b34;
      color: white;
      padding: 2em;
      font-family: Arial, sans-serif;
    }
    #chart {
      width: 100%;
      height: 500px;
    }
  </style>
</head>
<body>
  <h1>Sprit beholdning</h1>
  <div id="chart"></div>

  <script>
    var fig = {{ graphJSON | safe }};
    Plotly.newPlot('chart', fig.data, fig.layout);
  </script>
</body>
</html>
